<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Signal App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0b18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }
        .header {
            text-align: center;
            margin-bottom: 6px;
        }
        .header h1 {
            color: #d946ef;
            font-size: 20px;
            margin: 0;
        }
        .header p {
            color: #94a3b8;
            font-size: 10px;
            margin: 2px 0;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 10px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 10px;
            color: #a855f7;
            font-weight: bold;
            margin-bottom: 3px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .select-pair {
            width: 100%;
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }
        .btn-option {
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 7px;
            border-radius: 6px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 11px;
            user-select: none;
        }
        .btn-option.active {
            border-color: #d946ef;
            background: #2a1b4e;
            box-shadow: 0 0 6px rgba(217, 70, 239, 0.4);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #a855f7, #d946ef);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 10px rgba(217, 70, 239, 0.3);
            margin-top: 10px;
        }
        #status {
            margin-top: 5px;
            text-align: center;
            font-size: 11px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PocketX AI</h1>
        <p>Real-Time Trading Signal Assistant</p>
    </div>

    <div class="card">
        <div class="section-title">ΕΠΙΛΟΓΗ CURRENCIES OTC</div>
        <select id="pair-select" class="select-pair" onchange="changePair(this)">
            <option value="EUR/USD OTC">EUR/USD OTC</option>
            <option value="GBP/USD OTC">GBP/USD OTC</option>
            <option value="USD/JPY OTC">USD/JPY OTC</option>
            <option value="AUD/USD OTC">AUD/USD OTC</option>
            <option value="USD/CHF OTC">USD/CHF OTC</option>
            <option value="NZD/USD OTC">NZD/USD OTC</option>
            <option value="USD/CAD OTC">USD/CAD OTC</option>
            <option value="EUR/GBP OTC">EUR/GBP OTC</option>
            <option value="EUR/JPY OTC">EUR/JPY OTC</option>
            <option value="GBP/JPY OTC">GBP/JPY OTC</option>
            <option value="AUD/CAD OTC">AUD/CAD OTC</option>
            <option value="AUD/JPY OTC">AUD/JPY OTC</option>
            <option value="CAD/JPY OTC">CAD/JPY OTC</option>
            <option value="CHF/JPY OTC">CHF/JPY OTC</option>
            <option value="EUR/AUD OTC">EUR/AUD OTC</option>
            <option value="EUR/CAD OTC">EUR/CAD OTC</option>
            <option value="EUR/NZD OTC">EUR/NZD OTC</option>
            <option value="GBP/AUD OTC">GBP/AUD OTC</option>
            <option value="GBP/CAD OTC">GBP/CAD OTC</option>
            <option value="GBP/CHF OTC">GBP/CHF OTC</option>
            <option value="GBP/NZD OTC">GBP/NZD OTC</option>
            <option value="NZD/JPY OTC">NZD/JPY OTC</option>
        </select>

        <div class="section-title">ΧΡΟΝΟΣ ΛΗΞΗΣ (EXPIRATION)</div>
        <div class="grid" id="time-grid">
            <div class="btn-option active" onclick="selectTime(this, '5s')">5 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '15s')">15 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '30s')">30 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '1m')">1 λεπτό</div>
        </div>

        <button class="btn-main" onclick="requestSignal()">🔥 ΛΗΨΗ ΣΗΜΑΤΟΣ 🔥</button>
        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedPair = "EUR/USD OTC";
        let selectedTime = "5s";

        function changePair(selectElement) {
            selectedPair = selectElement.value;
        }

        function selectTime(element, time) {
            document.querySelectorAll('#time-grid .btn-option').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedTime = time;
        }

        function requestSignal() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ Αποστολή...";

            const data = {
                pair: selectedPair,
                time: selectedTime
            };

            try {
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(data));
                    statusDiv.innerText = "✅ Στάλθηκε!";
                } else {
                    statusDiv.innerText = `⚠️ (Test): ${selectedPair} - ${selectedTime}`;
                }
            } catch (e) {
                statusDiv.innerText = "⚠️ Σφάλμα.";
            }
        }
    </script>
</body>
</html>
