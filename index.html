<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Signal App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0b18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 12px;
        }
        .header h1 {
            color: #d946ef;
            font-size: 24px;
            margin: 0;
        }
        .header p {
            color: #94a3b8;
            font-size: 11px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 15px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 11px;
            color: #a855f7;
            font-weight: bold;
            margin-bottom: 6px;
            margin-top: 10px;
            text-transform: uppercase;
        }
        .select-pair {
            width: 100%;
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .select-pair:focus {
            border-color: #d946ef;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-option {
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            user-select: none;
        }
        .btn-option.active {
            border-color: #d946ef;
            background: #2a1b4e;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #a855f7, #d946ef);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
            margin-top: 15px;
            transition: 0.2s;
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 10px;
            text-align: center;
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PocketX AI</h1>
        <p>Real-Time Trading Signal Assistant</p>
    </div>

    <div class="card">
        <div class="section-title">ΕΠΙΛΟΓΗ OTC ΖΕΥΓΑΡΙΟΥ</div>
        <select id="pair-select" class="select-pair" onchange="changePair(this)">
            <optgroup label="Forex OTC">
                <option value="EUR/USD OTC">EUR/USD OTC</option>
                <option value="GBP/USD OTC">GBP/USD OTC</option>
                <option value="USD/JPY OTC">USD/JPY OTC</option>
                <option value="AUD/CAD OTC">AUD/CAD OTC</option>
                <option value="EUR/GBP OTC">EUR/GBP OTC</option>
                <option value="USD/CHF OTC">USD/CHF OTC</option>
                <option value="NZD/USD OTC">NZD/USD OTC</option>
                <option value="AUD/USD OTC">AUD/USD OTC</option>
                <option value="EUR/JPY OTC">EUR/JPY OTC</option>
                <option value="GBP/JPY OTC">GBP/JPY OTC</option>
            </optgroup>
            <optgroup label="Crypto & Commodities OTC">
                <option value="BTC/USD OTC">BTC/USD OTC</option>
                <option value="ETH/USD OTC">ETH/USD OTC</option>
                <option value="LTC/USD OTC">LTC/USD OTC</option>
                <option value="XRP/USD OTC">XRP/USD OTC</option>
                <option value="Gold OTC">Gold OTC (Χρυσός)</option>
                <option value="Silver OTC">Silver OTC (Ασημί)</option>
            </optgroup>
        </select>

        <div class="section-title">ΧΡΟΝΟΣ ΛΗΞΗΣ (EXPIRATION)</div>
        <div class="grid" id="time-grid">
            <div class="btn-option active" onclick="selectTime(this, '5s')">5 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '15s')">15 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '30s')">30 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '1m')">1 λεπτό</div>
        </div>

        <button class="btn-main" onclick="requestSignal()">🔥 ΛΗΨΗ ΣΗΜΑΤΟΣ 🔥</button>
        <div id="status"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedPair = "EUR/USD OTC";
        let selectedTime = "5s";

        function changePair(selectElement) {
            selectedPair = selectElement.value;
        }

        function selectTime(element, time) {
            document.querySelectorAll('#time-grid .btn-option').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedTime = time;
        }

        function requestSignal() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ Αποστολή αιτήματος στο bot...";

            const data = {
                pair: selectedPair,
                time: selectedTime
            };

            try {
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(data));
                    statusDiv.innerText = "✅ Το σήμα στάλθηκε! Ελέγξτε το chat.";
                } else {
                    statusDiv.innerText = `⚠️ (Test Mode) Επιλέξατε: ${selectedPair} - ${selectedTime}`;
                }
            } catch (e) {
                statusDiv.innerText = "⚠️ Σφάλμα αποστολής δεδομένων.";
            }
        }
    </script>
</body>
</html>
