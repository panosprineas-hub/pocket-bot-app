<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Signal App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0b18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            color: #d946ef;
            font-size: 28px;
            margin: 0;
        }
        .header p {
            color: #94a3b8;
            font-size: 13px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 350px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 12px;
            color: #a855f7;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-option {
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: 0.2s;
            user-select: none;
        }
        .btn-option.active {
            border-color: #d946ef;
            background: #2a1b4e;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #a855f7, #d946ef);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
            margin-top: 10px;
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 13px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PocketX AI</h1>
        <p>Real-Time Trading Signal Assistant</p>
    </div>

    <div class="card">
        <div class="section-title">ΕΠΙΛΟΓΗ ΖΕΥΓΑΡΙΟΥ</div>
        <div class="grid" id="pair-grid">
            <div class="btn-option active" onclick="selectPair(this, 'EUR/USD OTC')">EUR/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this, 'GBP/USD OTC')">GBP/USD OTC</div>
            <div class="btn-option" onclick="selectPair(this, 'USD/JPY OTC')">USD/JPY OTC</div>
            <div class="btn-option" onclick="selectPair(this, 'BTC/USD')">BTC/USD</div>
        </div>

        <div class="section-title">ΧΡΟΝΟΣ ΛΗΞΗΣ (EXPIRATION)</div>
        <div class="grid" id="time-grid">
            <div class="btn-option active" onclick="selectTime(this, '3s')">3 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '5s')">5 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '10s')">10 δευτ.</div>
            <div class="btn-option" onclick="selectTime(this, '1m')">1 λεπτό</div>
        </div>

        <button class="btn-main" onclick="requestSignal()">🔥 ΛΗΨΗ ΣΗΜΑΤΟΣ 🔥</button>
        <div id="status"></div>
    </div>

    <script>
        // Αρχικοποίηση Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let selectedPair = "EUR/USD OTC";
        let selectedTime = "3s";

        function selectPair(element, pair) {
            const buttons = document.querySelectorAll('#pair-grid .btn-option');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedPair = pair;
        }

        function selectTime(element, time) {
            const buttons = document.querySelectorAll('#time-grid .btn-option');
            buttons.forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            selectedTime = time;
        }

        function requestSignal() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "⏳ Αποστολή αιτήματος στο bot...";

            const data = {
                pair: selectedPair,
                time: selectedTime
            };

            try {
                // Στέλνει τα δεδομένα πίσω στο Telegram Bot σου
                if (tg && tg.sendData) {
                    tg.sendData(JSON.stringify(data));
                    statusDiv.innerText = "✅ Το σήμα στάλθηκε! Ελέγξτε το chat.";
                } else {
                    // Αν τρέχει εκτός Telegram (π.χ. σε απλό browser για δοκιμή)
                    statusDiv.innerText = `⚠️ (Test Mode) Επιλέξατε: ${selectedPair} - ${selectedTime}`;
                }
            } catch (e) {
                statusDiv.innerText = "⚠️ Σφάλμα αποστολής δεδομένων.";
            }
        }
    </script>
</body>
</html>
