<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pocket Option Signal App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0d0b18;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 15px;
        }
        .header h1 {
            color: #d946ef;
            font-size: 26px;
            margin: 0;
        }
        .header p {
            color: #94a3b8;
            font-size: 12px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            backdrop-filter: blur(10px);
        }
        .section-title {
            font-size: 11px;
            color: #a855f7;
            font-weight: bold;
            margin-bottom: 8px;
            margin-top: 15px;
            text-transform: uppercase;
        }
        /* Dropdown για όλα τα OTC Pairs */
        .select-pair {
            width: 100%;
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            outline: none;
            cursor: pointer;
            transition: 0.2s;
        }
        .select-pair:focus {
            border-color: #d946ef;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .btn-option {
            background: #18152e;
            border: 1px solid #332d56;
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            transition: 0.2s;
            user-select: none;
        }
        .btn-option.active {
            border-color: #d946ef;
            background: #2a1b4e;
            box-shadow: 0 0 10px rgba(217, 70, 239, 0.4);
        }
        .btn-main {
            width: 100%;
            background: linear-gradient(90deg, #a855f7, #d946ef);
            border: none;
            color: white;
            padding: 15px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(217, 70, 239, 0.3);
            margin-top: 20px;
            transition: 0.2s;
        }
        .btn-main:active {
            transform: scale(0.98);
        }
        #status {
            margin-top: 15px;
            text-align: center;
            font-size: 12px;
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>PocketX AI</h1>
        <p>Real-Time Trading Signal Assistant</p>
    </div>

    <div class="card">
        <div class="section-title">ΕΠΙΛΟΓΗ OTC ΖΕΥΓΑΡΙΟΥ</div>
        <select id="pair-select" class="select-pair" onchange="changePair(this)">
            <optgroup label="Forex OTC">
                <option value="EUR/USD OTC">EUR/USD OTC</option>
                <option value="GBP/USD OTC">GBP/USD OTC</option>
                <option value="USD/JPY OTC">USD/JPY OTC</option>
                <option value="AUD/CAD OTC">AUD/CAD OTC</option>
                <option value="EUR/GBP OTC">EUR/GBP OTC</option>
                <option value="USD/CHF OTC">USD/CHF OTC</option>
                <option value="NZD/USD OTC">NZD/USD OTC</option>
                <option value="AUD/USD OTC">AUD/USD OTC</option>
                <option value="EUR/JPY OTC">EUR/JPY OTC</option>
                <option value="GBP/JPY OTC">GBP/JPY OTC</option>
